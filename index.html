<script>
/* ===================== 全域工具 ===================== */
/* ---------- 手機朗讀修正版 TTS ---------- */
var TTS_OK=false, TTS_VOICES=[], TTS_VOICE=null, TTS_UNLOCKED=false, TTS_TIMER=null;
try{TTS_OK=(typeof window.speechSynthesis!=="undefined"&&typeof window.SpeechSynthesisUtterance!=="undefined");}catch(e){TTS_OK=false;}

function loadVoices(){
  if(!TTS_OK)return;
  try{TTS_VOICES=window.speechSynthesis.getVoices()||[];}catch(e){TTS_VOICES=[];}
  if(!TTS_VOICES.length)return;
  var pref=["Samantha","Zira","Google US English","Karen","Moira","Tessa","Aaron","Daniel","Alex"];
  var i,j;
  for(i=0;i<pref.length;i++){
    for(j=0;j<TTS_VOICES.length;j++){
      if(TTS_VOICES[j].name.indexOf(pref[i])>=0&&/^en/i.test(TTS_VOICES[j].lang||"en")){TTS_VOICE=TTS_VOICES[j];return;}
    }
  }
  for(j=0;j<TTS_VOICES.length;j++){if(/female/i.test(TTS_VOICES[j].name)&&/^en/i.test(TTS_VOICES[j].lang)){TTS_VOICE=TTS_VOICES[j];return;}}
  for(j=0;j<TTS_VOICES.length;j++){if(/^en[-_]US/i.test(TTS_VOICES[j].lang)){TTS_VOICE=TTS_VOICES[j];return;}}
  for(j=0;j<TTS_VOICES.length;j++){if(/^en/i.test(TTS_VOICES[j].lang)){TTS_VOICE=TTS_VOICES[j];return;}}
  TTS_VOICE=null;
}
if(TTS_OK){
  loadVoices();
  try{window.speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}
  /* 有些 Android 需要多試幾次才拿得到語音清單 */
  var vTry=0,vInt=setInterval(function(){loadVoices();vTry++;if(TTS_VOICE||vTry>20)clearInterval(vInt);},250);
}
/* iOS / Android 必須在「使用者手勢」中先發過一次聲音，之後才允許程式觸發朗讀 */
function unlockTTS(){
  if(!TTS_OK||TTS_UNLOCKED)return;
  try{
    var u=new window.SpeechSynthesisUtterance(" ");
    u.volume=0;u.lang="en-US";u.rate=0.9;
    window.speechSynthesis.speak(u);
    TTS_UNLOCKED=true;
    loadVoices();
  }catch(e){}
}
["touchstart","touchend","pointerdown","mousedown","click","keydown"].forEach(function(ev){
  document.addEventListener(ev,unlockTTS,{once:false,passive:true});
});

function say(txt,rate){
  var RATE=(typeof rate==="number"&&rate>0)?rate:0.9;
  txt=String(txt||"").replace(/\s+/g," ").trim();
  if(!txt)return;
  if(!TTS_OK){toast("此裝置或瀏覽器不支援語音朗讀，請改用 Chrome 或 Safari 開啟 🙏");return;}
  unlockTTS();
  try{
    var synth=window.speechSynthesis;
    /* 修正 Chrome/Android「講一半卡住」與 iOS pause 狀態 */
    if(synth.speaking||synth.pending)synth.cancel();
    if(synth.paused)synth.resume();
    if(!TTS_VOICE)loadVoices();
    var go=function(){
      /* 手機一次只送一段完整文字，避免多段排隊造成不發聲 */
      var u=new window.SpeechSynthesisUtterance(txt);
      u.lang="en-US";u.rate=RATE;u.pitch=1.0;u.volume=1;
      if(TTS_VOICE)u.voice=TTS_VOICE;
      var started=false;
      u.onstart=function(){started=true;};
      u.onerror=function(){clearInterval(TTS_TIMER);};
      u.onend=function(){clearInterval(TTS_TIMER);};
      try{synth.speak(u);}catch(e){toast("朗讀失敗，請再點一次 🙏");return;}
      /* Chrome 桌機／Android 長句 15 秒截斷的已知 bug：定時 resume */
      clearInterval(TTS_TIMER);
      TTS_TIMER=setInterval(function(){
        if(!synth.speaking){clearInterval(TTS_TIMER);return;}
        try{synth.pause();synth.resume();}catch(e){}
      },8000);
      /* 若 500ms 後仍未開始（部分 Android 需重送一次） */
      setTimeout(function(){
        if(!started&&!synth.speaking){
          try{synth.cancel();synth.speak(u);}catch(e){}
        }
      },500);
    };
    /* 語音清單尚未載入時，稍等再送 */
    if(!TTS_VOICES.length){setTimeout(function(){loadVoices();go();},220);}else{go();}
  }catch(e){toast("朗讀失敗，請再點一次 🙏");}
}
function stopSay(){try{if(TTS_OK){clearInterval(TTS_TIMER);window.speechSynthesis.cancel();}}catch(e){}}
window.addEventListener("beforeunload",stopSay);

function toast(m){var t=document.getElementById("toast");t.textContent=m;t.style.display="block";
  clearTimeout(t._t);t._t=setTimeout(function(){t.style.display="none";},3500);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ===================== Kahoot 計分 ===================== */
var totalScore=0, roundScore=0;
function addScore(n){
  totalScore=Math.max(0,totalScore+n);
  roundScore=Math.max(0,roundScore+n);
  var b=document.getElementById("scoreBar");
  document.getElementById("total").textContent=totalScore;
  document.getElementById("round").textContent=roundScore;
  b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop");
}
function resetRound(){roundScore=0;document.getElementById("round").textContent=0;}
function tgScore(){document.getElementById("scoreBar").classList.toggle("on");}

/* ===================== 煙火 ===================== */
function fireworks(){
  var c=document.getElementById("fw");c.style.display="block";
  c.width=innerWidth;c.height=innerHeight;
  var x=null;try{x=c.getContext("2d");}catch(e){}
  if(!x){c.style.display="none";return;}
  var ps=[],cols=["#F0A6C0","#7ED4B0","#B9A8E8","#FFDE59","#8CCBEE","#FFB877"];
  for(var b=0;b<6;b++){
    var cx=Math.random()*innerWidth,cy=Math.random()*innerHeight*0.6+40,col=cols[b%cols.length];
    for(var i=0;i<60;i++){var a=Math.random()*Math.PI*2,s=Math.random()*5+1.5;
      ps.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:col});}
  }
  var f=0;
  (function loop(){
    x.clearRect(0,0,c.width,c.height);f++;
    ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.l-=0.012;
      if(p.l>0){x.globalAlpha=p.l;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,2.6,0,7);x.fill();}});
    if(f<120)requestAnimationFrame(loop);else{x.clearRect(0,0,c.width,c.height);c.style.display="none";}
  })();
}

/* ===================== 浮動選單 ===================== */
var TABS=[
 {id:"vocab",label:"💡 字彙對對碰"},
 {id:"go",label:"🧭 Let's G.O."},
 {id:"read",label:"📖 課文解析"},
 {id:"gram",label:"🧩 課文文法重點"},
 {id:"deep",label:"🧠 深度挑戰"},
 {id:"struct",label:"🧩 結構圖解"},
 {id:"sp",label:"✍️ Sentence Pattern"}
];
function buildTabs(){
  var m=document.getElementById("main"),mp=document.getElementById("menuPanel"),h="",mh="";
  TABS.forEach(function(t){
    h+='<button id="tb-'+t.id+'" onclick="go(\''+t.id+'\')">'+t.label+'</button>';
    mh+='<section class="tabpane" id="tp-'+t.id+'"></section>';
  });
  h+='<button onclick="tgScore();closeMenu()">🏆 顯示／隱藏計分列</button>';
  h+='<button onclick="testTTS()">🔊 測試手機英語發音</button>';
  mp.innerHTML=h;m.innerHTML=mh;
}
function testTTS(){
  closeMenu();
  if(!TTS_OK){toast("此裝置或瀏覽器不支援語音朗讀，建議改用 Chrome 或 Safari 🙏");return;}
  say("Do animals sleep like you and me?");
  toast("正在測試發音。若沒聲音，請確認手機沒有靜音／勿擾模式，並把音量調大 🔊");
}
function tgMenu(){
  var p=document.getElementById("menuPanel"),k=document.getElementById("menuMask"),b=document.getElementById("menuBtn");
  var open=!p.classList.contains("open");
  p.classList.toggle("open",open);k.classList.toggle("open",open);
  b.textContent=open?"✕ 關閉":"☰ 選單";
  if(open)p.style.top=(document.querySelector("header").offsetHeight+6)+"px";
}
function closeMenu(){
  document.getElementById("menuPanel").classList.remove("open");
  document.getElementById("menuMask").classList.remove("open");
  document.getElementById("menuBtn").textContent="☰ 選單";
}
function go(id){
  stopSay();
  TABS.forEach(function(t){
    document.getElementById("tb-"+t.id).classList.toggle("on",t.id===id);
    document.getElementById("tp-"+t.id).classList.toggle("on",t.id===id);
  });
  closeMenu();window.scrollTo({top:0,behavior:"smooth"});closeAn();
}
window.addEventListener("scroll",function(){if(window.scrollY>150)closeMenu();});

/* ===================== 📖 參考解答 展開 ===================== */
var revId=0;
function reveal(html){
  var id="rv"+(revId++);
  return '<button class="btn lemon sm" onclick="var e=document.getElementById(\''+id+'\');e.classList.toggle(\'open\')">📖 參考解答：</button>'+
         '<div class="exp" id="'+id+'">'+html+'</div>';
}
</script>
<script>
/* ===================== 資料：應用字彙 ===================== */
var CAT_PROD=[
 {en:"wonder",zh:"想知道 vt. vi.",ex:"I wonder why my girlfriend left me without saying a word."},
 {en:"wonder in wonder",zh:"驚歎 n. [U]（in wonder 驚歎地）",ex:"All the people present gazed up at the Northern Lights in wonder."},
 {en:"(it's) no/little wonder that",zh:"不足為奇",ex:"It's no wonder that the Northern Lights are one of the world's wonders people want to witness."},
 {en:"a natural wonder",zh:"自然奇觀 n. [C]",ex:"The Northern Lights are a natural wonder that attracts hundreds of thousands of tourists annually."},
 {en:"work/do wonders",zh:"有奇效",ex:"When you're not feeling well, try to have a good laugh. It may work wonders."},
 {en:"amazing",zh:"令人大感驚奇的 adj.",ex:"It's amazing how you can always understand my thoughts and feelings."},
 {en:"an amazing performance",zh:"驚人的表演（achievement/discovery/victory）",ex:"The band gave an amazing performance tonight, capturing the hearts of everyone in the audience."},
 {en:"amaze",zh:"使人驚奇 vt.",ex:"It amazed the spectators when the soccer player scored three goals in a row."},
 {en:"It amazed sb. to learn...",zh:"某人很驚訝地看見／發現／得知……",ex:"It amazed me to learn that Melody goes to the gym every day."},
 {en:"What amazes sb. is...",zh:"令某人驚奇的是……",ex:"What amazes me is how much progress Tom has made in such a short time."},
 {en:"in amazement",zh:"驚奇地 n. [U]",ex:"All the people present looked up at the Northern Lights in amazement."},
 {en:"To one's amazement",zh:"令某人驚奇的是……",ex:"To our amazement, we beat a tough opponent and made it to the finals."},
 {en:"average",zh:"平均 n. [U, C]（on average 平均）",ex:"It takes me on average an hour and a half to cook a meal."},
 {en:"above/below average",zh:"高於／低於平均",ex:"The junior high students in this town are below average in their academic performance."},

{p:1,zh:"你也許知道棕熊會冬眠，金魚睡覺時眼睛不用閉著，但是你有想過其他動物怎麼睡覺嗎？以下是一些有關動物睡眠習慣的奇妙事實，你讀的時候可能會覺得驚訝。",
 s:[
 ["You may know that brown bears hibernate and that goldfish sleep without closing their eyes, but have you ever wondered how other animals sleep?","(1) may 為情狀助動詞，與原形動詞連用，表推測可能性。(2) 兩個 that 為對等連接的名詞子句，共同當 know 的受詞。(3) without 為介系詞，接動名詞，說明「沒有做出某動作」。(4) Have you ever + p.p. 用現在完成式詢問經驗，ever 表 at any time。(5) how other animals sleep 為疑問詞 how 引導的間接問句（名詞子句），作 wondered 的受詞，語序為 S + V，不倒裝——這正是本課句型重點。<br>📌 寫作策略：先建立共同知識（讀者已知）→ 再用 but 拋出問句（讀者未知），是典型的「共同知識開場（common ground opener）」。"],
 ["You might be surprised when you read some of the following amazing facts about animals' sleeping habits.","(1) might 語氣比 may 更不確定、更委婉。(2) surprised 為過去分詞表情緒「感到驚訝的」，以人為主詞；類似用法有 amazed、shocked、excited。(3) some of... 表「其中的一些」，of 後名詞須以 the 或所有格限定。(4) following 為形容詞「以下的、接下來的」。(5) sleeping habits 的 sleeping 為動名詞當名詞用（表用途／特質），比較 a sleeping baby（現在分詞，正在睡的嬰兒）與 a sleeping car（臥鋪車廂）。<br>📌 following 與 some of 已預告全文為「並列的多則案例（exemplification）」，這也是結論段能說 these are just four examples 的原因。"]
]},
{p:2,zh:"有別於大部分的哺乳類動物，長頸鹿睡得很少。事實上，據報導有些長頸鹿平均一天只睡三十分鐘。長頸鹿睡覺時，會捲曲著脖子，把頭放在臀部上。然而，常常有掠食者在附近，用這個姿勢睡覺沒辦法迅速站直，因此長頸鹿從來都不會睡太久。",
 s:[
 ["Unlike most mammals, giraffes sleep very little.","unlike 為介系詞，表「不像；和……不同」，是本段的對比訊號詞（contrast signal）。它一開頭就把長頸鹿定位為「特例」，讀者因而預期後文會說明特殊之處。"],
 ["In fact, it is reported that some giraffes sleep only thirty minutes a day on average.","(1) in fact 事實上（同 as a matter of fact; actually），用以強化前句。(2) It is reported that... 為「虛主詞＋被動」的客觀句型，刻意隱去消息來源，語氣客觀且保留餘地；同類還有 It is said/believed/estimated that...。(3) thirty minutes a day 為「一天三十分鐘」，注意中英語序差異。<br>📌 三個弱化詞連用（it is reported／some／on average）是嚴謹科普寫作的標記。改寫：Some giraffes are reported to sleep only thirty minutes a day."],
 ["When a giraffe sleeps, it curls its long neck and lays its head on its hip.","lay 為及物動詞「安放、放置」（lay-laid-laid-laying），同 put down；請與 lie（lie-lay-lain-lying 躺、位於）及 lie（lie-lied-lied-lying 說謊）區分。本句單獨讀只是可愛的冷知識，其意義要到 However 之後才被重新定義。"],
 ["However, there are often predators around, and a giraffe can't stand up from this position very quickly.","(1) however 為轉承語，標示「條件反轉」——把前句的睡姿從「冷知識」重新定義為「風險」。(2) there is/are 為存現句，動詞單複數視其後名詞而定。(3) this position 為照應（anaphor），回指前句整個描述（curls its long neck and lays its head on its hip），而非單一名詞；讀者不回頭連結，整句就懸空。(4) and 在此是「外部威脅＋內部限制」的疊加，兩者缺一不可。"],
 ["Therefore, a giraffe never naps for too long.","therefore 為因果收束訊號。for long = for a long time，常用於疑問句與否定句：Have you lived here for long? / not for very long. 本段完整因果鏈為：睡姿 → 起身慢 → 掠食者環伺 → 因此不敢久睡。"]
]},
{p:3,zh:"海獺是世界上最可愛的動物之一，或許牠們的睡姿也是最可愛的。成群的海獺睡覺時，會手牽手仰漂在海面上！牠們可以在陸地上休息，但是在水上會更安全。為了避免漂走，牠們會緊扣彼此的小爪子，把對方抓牢。",
 s:[
 ["Sea otters, one of the world's cutest animals, perhaps have the cutest sleeping position.","one of the + 最高級 + 複數名詞 = among the + 最高級 + 複數名詞，意為「最……之一」。此處為同位語，插在主詞與動詞之間補充說明。"],
 ["Groups of sea otters float on their backs and hold hands while they are sleeping!","while 表「某件事正在進行的同時」，常與進行式或表狀態的形容詞連用。float on their backs 仰漂；hold hands 牽手——兩個並列動作構成本段的畫面焦點。"],
 ["They can rest on the land, but they are much safer in the water.","這是「讓步 → 反轉（concession → reversal）」：先承認陸地是可行的替代選項，再用 but 指出它較差，藉此證明「在水中睡覺」是主動選擇而非被迫。much 用來修飾比較級（另有 a lot, even, still, a little）。若刪掉前半句，much safer 就失去比較基準。"],
 ["To avoid floating away, they lock their little paws together and hold on to each other.","(1) To + VR 表目的（= In order to...），置於句首屬副屬結構，承載「為什麼」；主句兩個對等動詞 lock 與 hold on 承載「做什麼」。(2) avoid 後接動名詞：avoid floating（○）／avoid to float（✗）。(3) each other 彼此。(4) lock 原指「上鎖」，用於身體部位為隱喻延伸，表「緊扣、卡死而無法分開」，比 put together 更能呼應「不漂走」的目的。<br>📌 可愛是包裝，求生才是內核——與末段 each animal is an expert at surviving 呼應。"]
]},
{p:4,zh:"海豚有一個令人驚奇不已的睡眠小祕密：每次睡覺只有半邊腦是睡著的！這種睡眠習慣的其中一個原因是牠們必須每二十分鐘就游上水面呼吸，同時牠們還得注意鯊魚和其他掠食者。當牠們半邊的腦睡著的時候，另外半邊的腦部會保持清醒，以利牠們游泳、呼吸和注意危險。",
 s:[
 ["Dolphins have one of the most amazing sleeping secrets: only half their brain is asleep at a time!","(1) half 在此為代名詞，常見用法為 half (of) + N，half 前不再加 a 或 the。(2) at a time 一次。(3) 冒號用來引出「祕密」的具體內容，製造揭曉效果。本句即為全段主旨句。"],
 ["One of the reasons for this is that they must swim to the surface once every twenty minutes to breathe.","(1) One of the reasons 承認「原因不只一個」，語氣審慎而不武斷，是科普寫作的自我設限（hedging）；若寫成 The reason is that...，等於宣稱已窮盡所有原因。(2) this 回指前句整個命題「半腦睡眠」，屬句層照應（sentence-level anaphora）。(3) must 同 have to，本身無過去式，過去須用 had to。(4) once every twenty minutes 每二十分鐘一次。"],
 ["They also have to look out for sharks and other predators.","look out for 當心……出現（警告危險）。此為第二個理由：外部威脅。also 標示理由的累加。"],
 ["When one half of their brain goes to sleep, the other half stays awake to help them swim, breathe, and be on the lookout for danger.","(1) When 子句為從屬（提供時間框架），主句 the other half stays awake 才是核心事實。(2) One... The other... 為「兩者之中的一個與另一個」的固定搭配，指同一顆腦的兩半。(3) stay 為連綴動詞後接形容詞，同 remain。(4) help + sb. (+ to) + VR；其後 swim / breathe / be on the lookout for danger 三者對等並列，必須維持平行結構（parallelism）——注意第三項是 be 動詞原形，不加 to，這是學測作文最常見的平行結構陷阱。"]
]},
{p:5,zh:"有些候鳥則有另一項驚人的睡眠方式：邊飛邊睡！以高山雨燕為例，牠們在往返非洲的長程旅途中，必須長時間飛行。牠們沿途在空中吃昆蟲，也會在飛行中小睡。這種習慣可以保全性命，因為如果牠們著陸，就可能被野生動物給吞下肚。據研究，這種神奇的小鳥可以連續飛行長達 200 天，無須落地補眠。",
 s:[
 ["Some migratory birds have yet another impressive way of sleeping: they sleep up in the sky!","(1) yet 在此為副詞「還有……」，加強語氣；yet another 明確標示這是同類清單中的第 N 項，暗示前面已有長頸鹿、海獺、海豚三例——它是把段落串成整體的篇章照應詞（anaphoric linker）。(2) another 表「（未限定的）另外一個」。(3) way of + V-ing = way to VR 做某事的方式。"],
 ["For example, Alpine swifts have to keep flying for a long time over a great distance during their journeys to and from Africa.","(1) For example 把層級往下推一階：由「一群候鳥」縮小到「高山雨燕」這個具體物種，是「通則 → 實例」的下位化訊號。(2) keep + V-ing 持續、不斷……。(3) during 為介系詞，後接名詞表期間。<br>📌 本段有兩層結構：對外用 yet another 連接全文清單，對內用 For example 由類到種。"],
 ["Along the way, they eat insects in the air and take little naps while in flight.","本句可還原為 ...while they are in flight.。while 為連接詞，前後子句主詞相同，故可省略副詞子句的主詞與 be 動詞，僅留下介系詞片語 in flight。take a nap 小睡片刻。"],
 ["This habit can save their lives since they may be caught by wild animals if they land.","(1) This habit 為照應詞，回指 take little naps while in flight（不是較靠近的 eat insects）——判斷依據是語意：救命的是「不落地」。位置近不等於指涉對象。(2) since 在此表「因為」（後接推測性情態 may）；若表「自從」，時態應為完成式。(3) if they land 是嵌在 since 子句裡的條件句，形成兩層從屬（since ⊃ if）。推論鏈：落地 → 可能被獵殺 → 所以不落地能保命。"],
 ["According to studies, these amazing little birds may be able to stay in the air for up to two hundred days without needing to land and get some sleep.","(1) according to 根據他人的說法；自己的看法要用 in my opinion。(2) studies 表「研究」多以複數出現；research 則為不可數。(3) may 為推測情態；因 may can 不合語法，故用 be able to 遞補表能力。(4) up to 最多可達（設定上限而非常態值）。(5) without + V-ing 沒有……。<br>📌 情態 + 上限詞 + 資料來源三者同時出現，是判斷「這是推測而非定論」的可靠訊號。"]
]},
{p:6,zh:"長頸鹿、海獺、海豚和高山雨燕的睡眠習慣看似相當神奇，然而這些只不過是四個例子。在動物世界裡有各式各樣的睡眠習慣，顯示不同的動物如何用不同的方式避險。誠如你所見，每種動物都有獨到的野外生存之道。",
 s:[
 ["The sleeping habits of the giraffe, sea otter, dolphin, and Alpine swift may seem quite amazing.","seem 為連綴動詞「似乎、看起來」，後可接形容詞或 to + VR。amazing 在此與首段的 amazing facts 首尾呼應（framing）：首段用它「承諾」，末段用它「兌現」。"],
 ["Yet these are just four examples.","yet 在此為副詞「然而」（若要連接兩子句則與 and 連用）。這句的作用是防止讀者把樣本誤當全體：just 正是為了預防此誤讀而寫。歸納論證的關鍵一步——先承認樣本有限，通則才顯得誠實可信。"],
 ["The wide variety of sleeping habits in the animal kingdom shows how different creatures have different ways of avoiding danger.","(1) 主詞是 The wide variety（單數），故動詞用 shows；of sleeping habits in the animal kingdom 全是修飾語——這是學測常考的「主詞與動詞被長修飾語隔開」的一致性判斷。(2) how... 為名詞子句（間接問句），語序不倒裝，與第一段 wondered how other animals sleep 前後呼應。(3) different creatures / different ways 的重複是刻意的平行對應，強化「一一對應」的邏輯。<br>📌 本句把「多樣性」重新定義為「求生策略的多樣性」，avoiding danger 才是四例的共同分母。"],
 ["As you can see, each animal is an expert at surviving in the wild.","(1) expert 原用於人（be an expert at/in sth.），此處用於動物屬擬人化的語意延伸，把「本能」提升為「專業」。(2) at 為介系詞，後接動名詞 surviving；比較 be good at V-ing／be skilled in V-ing。(3) As you can see 回指全文所有例證（篇章層級照應），語氣上把結論說成「讀者自己看出來的」，比 Therefore I conclude 更具說服力。(4) in the wild 在野外，the wild 在此為名詞。"]
]}
];

var RK=[
{p:"Paragraph 1｜Introduction",icon:"💡",items:[
 {lv:"主要資訊 Main Message（四選一）",type:"mc",
  q:"Q1. Why does the writer begin with brown bears and goldfish instead of going straight to the four animals discussed later?",
  o:["Because bears and goldfish sleep in the strangest ways of all.",
     "To use facts readers already know as a springboard into facts they don't know yet.",
     "To prove that mammals and fish sleep in exactly the same way.",
     "To warn readers that the article contains difficult scientific terms."],a:1,
  e:"答案：(B)<br>詳解：本段的寫作動機不是「介紹熊與金魚」，而是建立一個「已知 → 未知」的橋樑。You may know that... but have you ever wondered...? 是典型的「共同知識開場（common ground opener）」：先讓讀者點頭（我知道），再用問句製造知識缺口（我不知道），最後用 You might be surprised 預告價值。(A) 與全文矛盾——熊與金魚正是被拿來當「普通參照」的；(C)(D) 文中無此資訊。<br>易錯提醒：只抓 hibernate、goldfish 等字面詞就選 (A)，正是英文閱讀上的典型失分。"},
 {lv:"次要資訊 Secondary Message（簡答）",type:"sa",
  q:"Q2. This short paragraph performs three different jobs in three clauses. Identify them in order.",
  e:"【參考解答】<br>① 建立共同知識（You may know that brown bears hibernate and that goldfish sleep without closing their eyes）→ 讓讀者有安全感。<br>② 提出核心問題（have you ever wondered how other animals sleep?）→ 界定全文主題範圍：不是「動物睡不睡」，而是「怎麼睡」。<br>③ 預告閱讀價值與體例（You might be surprised... some of the following amazing facts）→ 暗示下文是「並列的多則案例」，而非單一論證。<br>詳解：三個功能對應 hook → thesis question → preview。第③句的 following 與 some of 已預告文章結構是「舉例式（exemplification）」，這也是為什麼結論段能說 these are just four examples。"},
 {lv:"訊息與細節 Details & Logic（四選一）",type:"mc",
  q:"Q3. \"You may know that brown bears hibernate and that goldfish sleep without closing their eyes, but have you ever wondered how other animals sleep?\" Which analysis of the structure is correct?",
  o:["兩個 that 子句為並列（coordination），共同當 know 的受詞；but 之後的問句才是主要訊息焦點。",
     "第二個 that 是關係代名詞，修飾 brown bears，強調讀者已知的動物科普。",
     "but 連接的兩句地位相同，重點平均分配分析動物睡眠方式之差異與其原因。",
     "how other animals sleep 是直接問句，故 sleep 須移到 animals 之前。"],a:0,
  e:"答案：(A)<br>詳解：兩個 that 為對等連接的名詞子句（省略第二個 that 亦可，但作者保留以求清晰），語法地位相同。真正的閱讀重點在 but 之後——這是「讓步／對比 → 焦點後移」的訊號：but 之前是舊資訊，之後才是新資訊。<br>(D) 錯在 how other animals sleep 是「間接問句（indirect question）」，須用直述句語序 S+V，這正是本課句型重點。<br>延伸：I wonder how she did it.（○）／I wonder how did she do it.（✗）"},
 {lv:"語言結構與生活活用 Language & Application（簡答）",type:"sa",
  q:"Q4. (a) Rewrite \"have you ever wondered how other animals sleep?\" as an indirect question beginning with \"I'm curious about...\"　(b) The word \"amazing\" appears in this paragraph and again in the last. What job does this repetition do across the whole article?",
  e:"【參考解答】<br>(a) I'm curious about how other animals sleep.（間接問句一律 S+V 語序，不倒裝、不加助動詞 do/does/did。）<br>　比較：Do you know where the station is?（○）／Do you know where is the station?（✗）<br>(b) amazing 在首段（amazing facts）與末段（may seem quite amazing）重複出現，形成「語彙照應（lexical repetition）」的首尾呼應（framing）：首段用它「承諾」，末段用它「兌現」，讓四則案例被收攏成同一個主張。這是篇章連貫（coherence）的常見手法，並非作者詞彙貧乏。"}
]},
{p:"Paragraph 2｜Giraffes",icon:"📖",items:[
 {lv:"主要資訊 Main Message（四選一）",type:"mc",
  q:"Q1. What is the core message of the giraffe paragraph?",
  o:["Giraffes have the longest necks among all mammals.",
     "Thirty minutes of sleep a day is enough for most mammals.",
     "Giraffes prefer to sleep standing up rather than lying down.",
     "Giraffes sleep very little because their sleeping position leaves them slow to escape from predators."],a:3,
  e:"答案：(D)<br>詳解：本段是一條完整的因果鏈：sleeping position（curls neck, lays head on hip）→ can't stand up quickly → predators around → Therefore, never naps for too long。主旨必須包含「原因」與「結果」。(A) 只是達成該姿勢的條件，(B) 錯把「長頸鹿的特例」誤推為「多數哺乳類的通則」——事實上 Unlike most mammals 已明說相反。(C) 與文意相反（文中描述的是趴臥）。"},
 {lv:"次要資訊 Secondary Message（簡答）",type:"sa",
  q:"Q2. This paragraph begins with a contrast and ends with a conclusion. Identify the two signal words used for these transitions. Then, circle the third signal word in the middle and explain its purpose in Paragraph 2.",
  e:"【參考解答】對比訊號＝Unlike（most mammals）；結論訊號＝Therefore。中間的第三個訊號詞＝However，標示「條件反轉」。<br>詳解：發展脈絡為 Unlike（對比：與多數哺乳類不同）→ In fact（強化：舉出 30 分鐘數據）→ 描述睡姿（看似中性資訊）→ However（轉折：這個姿勢有致命缺點）→ Therefore（因果收束）。<br>關鍵在於：However 之前的睡姿描述若單獨讀，只是「可愛的冷知識」；However 之後才把它重新定義為「風險」。整段的說服力就建立在這個重新定義上——非線性閱讀的價值即在於此。"},
 {lv:"訊息與細節 Details & Logic（四選一）",type:"mc",
  q:"Q3. \"However, there are often predators around, and a giraffe can't stand up from this position very quickly.\" What does \"this position\" refer to, and why must the reader look backward to answer?",
  o:["It refers to standing on four legs; the reader looks forward.",
     "It refers to hibernating; the phrase will be further defined later in the article.",
     "It refers to the curled-neck, head-on-hip posture in the previous sentence.",
     "It refers to a position among the herd, i.e. social rank."],a:2,
  e:"答案：(C)<br>詳解：this position 是「照應（anaphor）」，回指前句整個描述性內容（curls its long neck and lays its head on its hip），而非單一名詞。英文的 this/that/such/as such 常用來把「前面一整串資訊」壓縮成一個名詞組再繼續論述——讀者若不回頭連結，整句就懸空。<br>另注意 and 在此並非單純並列時間，而是「情境＋弱點」的疊加：有掠食者（外部威脅）＋起身慢（內部限制）＝危險，兩者缺一不可。"},
 {lv:"語言結構與生活活用 Language & Application（四選一）",type:"mc",
  q:"Q4. In \"it is reported that some giraffes sleep only thirty minutes a day on average,\" the underlined structure is used mainly to:",
  o:["表示作者親自做過這項研究。",
     "強調長頸鹿是被別人報導的對象（受詞提前）。",
     "表示這件事一定是假造的，並非有事實根據。",
     "以被動語態隱去消息來源，表示「據報導／據說」，語氣客觀且保留餘地。"],a:3,
  e:"答案：(D)<br>詳解：It is reported/said/believed/estimated that... 屬「虛主詞＋被動」的學術「客觀句型」，作者刻意不指名來源，既維持客觀性，也為數據保留彈性（配合 some 與 on average 兩個弱化詞）。三個弱化詞連用（it is reported / some / on average）常用於嚴謹科普寫作的句型。<br>延伸改寫：Some giraffes are reported to sleep only thirty minutes a day.<br>生活活用（一字多義）：nap（名詞：小睡）→ take a nap／(動詞) He never naps for too long.；stand up 在此為「站起來」；生活中另有 stand up for（挺身捍衛）、stand sb. up（放某人鴿子）。例：He stood me up last night."}
]},
{p:"Paragraph 3｜Sea Otters",icon:"🧩",items:[
 {lv:"主要資訊 Main Message（四選一）",type:"mc",
  q:"Q1. Which best states the main point of this paragraph?",
  o:["Sea otters hold hands while sleeping because it keeps them from drifting apart.",
     "Sea otters are the cutest animals in the world.",
     "Sea otters cannot survive on land at all.",
     "Sea otters sleep on their backs because they cannot swim well."],a:0,
  e:"答案：(A)<br>詳解：段落表面寫「可愛」（cutest animals, cutest sleeping position），但最後一句 To avoid floating away, they lock their little paws together 才揭露功能性目的。主旨必須同時涵蓋「現象＋目的」——This cute habit is actually a safety strategy.<br>(B) 只抓到 cutest 這個字面形容詞，屬典型表層閱讀。(C) 與 They can rest on the land 直接矛盾。(D) 文中未提泳技。<br>思辨提示：本段與末段 each animal is an expert at surviving 呼應——「可愛」是包裝，「求生」才是內核。"},
 {lv:"次要資訊 Secondary Message（簡答）",type:"sa",
  q:"Q2. \"They can rest on the land, but they are much safer in the water.\" Why does the writer include the land option at all, since the paragraph is about sleeping in water?",
  e:"【參考解答】作者先承認一個「可行的替代選項」（陸地），再用 but 指出它較差，藉此證明「在水中睡覺」是主動選擇而非被迫。<br>詳解：這是「讓步 → 反轉（concession → reversal）」的論證手法。若刪去 They can rest on the land，讀者可能以為海獺別無選擇；加上它，much safer 的比較級才有比較基準，牽手行為也才升級為「有意識的生存策略」。這正是次要資訊「支撐論點」的功能——它不是多餘的閒筆。"},
 {lv:"訊息與細節 Details & Logic（四選一）",type:"mc",
  q:"Q3. \"To avoid floating away, they lock their little paws together and hold on to each other.\" How are the ideas connected?",
  o:["不定詞片語表目的，兩個動詞片語為同時發生的兩個動作，互為補充。",
     "不定詞片語表結果，意思是「結果就漂走了」。",
     "兩個動詞片語有先後因果：先 hold on 才 lock。",
     "To avoid 是主詞，floating away 是動詞。"],a:0,
  e:"答案：(A)<br>詳解：To avoid... 為表目的的不定詞片語（＝In order to avoid...），置於句首屬「副屬結構（subordination）」，承載「為什麼」；主句的兩個對等動詞 lock 與 hold on 為並列（coordination），承載「做什麼」。主副分明：目的在從屬子句，行為在主句。<br>(B) 是最常見誤讀——avoid 已含否定意味，to avoid floating away ＝「為了不漂走」，絕非「結果漂走了」。<br>延伸：avoid 後接動名詞（avoid + V-ing），不可接不定詞：avoid floating（○）／avoid to float（✗）"},
 {lv:"語言結構與生活活用 Language & Application（簡答）",type:"sa",
  q:"Q4. (a) \"lock their little paws together\" 用了什麼修辭？改成 \"put their paws together\" 為什麼較不能完整表達意思，缺了什麼？　(b) 請解釋 hold on to 與 hold on／hold up／hold back 的差異，各造一句。",
  e:"【參考解答】<br>(a) 隱喻／語意延伸（metaphor）。lock 原指「上鎖」，用於身體部位時延伸為「緊扣、卡死而無法分開」。改成 put 只剩「放在一起」的位置關係，失去「牢固、無法輕易分離」的力度，也削弱了它與 To avoid floating away（目的）之間的邏輯強度——鎖住才能不漂走。<br>(b) • hold on to ＝ 緊抓住（實體或抽象）：Hold on to the railing.／Hold on to your dreams.<br>　• hold on ＝（電話中）稍等：Hold on, I'll check.<br>　• hold up ＝ 延誤、耽擱；亦指持械搶劫：The accident held up traffic.<br>　• hold back ＝ 忍住、抑制：She held back her tears.<br>延伸一字多義：paw（動物的腳掌）／Keep your paws off my snacks!（口語幽默地指「手」）"}
]},
{p:"Paragraph 4｜Dolphins",icon:"🍪",items:[
 {lv:"主要資訊 Main Message（四選一）",type:"mc",
  q:"Q1. What is the writer's main point about dolphins?",
  o:["Dolphins never sleep because sharks are always nearby.",
     "Dolphins sleep with only half their brain at a time so that the other half can keep them breathing, swimming, and watching for danger.",
     "Dolphins must swim to the surface every twenty minutes to get fed by humans.",
     "Dolphins have larger brains than other sea creatures, which is why they are smarter."],a:1,
  e:"答案：(B)<br>詳解：主旨句即首句 only half their brain is asleep at a time，其餘句子全是「為什麼需要如此」（呼吸、防敵）與「如何運作」（另一半醒著）。<br>(A) 誤讀——半腦睡眠仍是睡眠，並非不睡；(C) 把 breathe 換成 eat，細節竄改；(D) 文中從未做腦容量比較。<br>陷阱說明：本題三個錯誤選項都使用了文中出現過的字（sharks, twenty minutes, brain），專門檢驗學生是否只憑「看過這個字」作答。"},
 {lv:"次要資訊 Secondary Message（簡答）",type:"sa",
  q:"Q2. The paragraph gives two reasons and one mechanism. Separate them, and explain why the writer uses such sentence patterns as \"One of the reasons for this is that...\"",
  e:"【參考解答】<br>理由一：必須每 20 分鐘浮出水面呼吸（生理需求）。<br>理由二：必須提防鯊魚等掠食者（外部威脅）。<br>機制：一半腦睡覺時，另一半清醒以維持游泳、呼吸與警戒。<br>詳解：One of the reasons 這個表達承認「原因不只一個」，作者只列出其中兩項，語氣審慎而不武斷——這是科普寫作的自我設限（hedging）。若寫成 The reason is that...，等於宣稱已窮盡所有原因，反而不嚴謹。學生在學測寫作中若能運用 One of the main reasons is that...，即是成熟語氣的展現。"},
 {lv:"訊息與細節 Details & Logic（四選一）",type:"mc",
  q:"Q3. \"When one half of their brain goes to sleep, the other half stays awake to help them swim, breathe, and be on the lookout for danger.\" Which reading of the sentence structure is correct?",
  o:["the other half 指的是另一隻海豚。",
     "三個動詞 swim / breathe / be on the lookout 分別接三個不同主詞，用以表達海豚大腦很活躍。",
     "to help 表結果，意思是「因此幫助了牠們」。",
     "When 子句為從屬（表時間條件），主句為 the other half stays awake；其後三個動詞 swim / breathe / be on the lookout 為並列，共用 help them。"],a:3,
  e:"答案：(D)<br>詳解：主副結構——When 子句提供時間框架（從屬），主句陳述核心事實。其後 to help them + 原形動詞三連（help 為使役性動詞，受詞後接原形）：swim, breathe, and be on the lookout for danger 三者對等並列，必須維持平行結構（parallelism）。<br>注意第三項是 be on the lookout（be 動詞原形），與前兩個實義動詞並列而不加 to，這是學測作文最常出錯的平行結構陷阱。<br>(A) 為照應誤判：one half / the other half 指同一顆腦的兩半，「one... the other...」是「兩者中的一個與另一個」的固定搭配。"},
 {lv:"語言結構與生活活用 Language & Application（四選一）",type:"mc",
  q:"Q4. Which sentence uses \"not only... but also...\" to place the emphasis where this paragraph places it?",
  o:["Dolphins not only watch for sharks but also have brains.",
     "A sleeping dolphin not only rests half its brain but keeps the other half awake.",
     "Not only dolphins but also sharks sleep with half a brain.",
     "Dolphins not only stay awake but also breathe at the same time."],a:1,
  e:"答案：(B)<br>詳解：not only A but also B 的語意重心永遠落在 B。本段的驚奇點是「另一半仍清醒工作」，故必須放在 but also 之後。<br>(A) 把「有腦」放在重心位置，語意荒謬；(C) 文中從未提及鯊魚也如此睡眠，屬無中生有；(D) 前後項互相矛盾且無遞進關係。<br>延伸（一字多義 + 照應）：<br>• surface（名詞：水面／表面；動詞：浮現）：New evidence surfaced last week.<br>• look out for ＝ 留意、提防；be on the lookout for ＝ 保持警戒狀態。比較 look after（照顧）／look into（調查）／look up to（敬佩）。<br>• this（One of the reasons for this）回指前句整個命題「半腦睡眠」，屬句層照應（sentence-level anaphora），非指單一名詞。"}
]},
{p:"Paragraph 5｜Migratory Birds / Alpine Swifts",icon:"🦋",items:[
 {lv:"主要資訊 Main Message（四選一）",type:"mc",
  q:"Q1. Why does the writer call sleeping in the sky a habit that \"can save their lives\"?",
  o:["Because flying uses less energy than resting on the ground.",
     "Because they cannot find enough insects on the ground.",
     "Because landing would expose them to wild animals, so staying in the mid air is the safer choice.",
     "Because they would get lost on land if they stopped flying in the air."],a:2,
  e:"答案：(C)<br>詳解：關鍵句為 since they may be caught by wild animals if they land。since 提供理由，if 提供條件，兩者合起來說明：落地＝風險，滯空＝安全。(A)(B)(D) 皆為文中未提的合理推測——「聽起來合理」與「文中有據」是兩回事，這正是高階閱讀必須嚴守的界線。<br>呼應提示：本段的求生邏輯與長頸鹿段（睡姿使起身變慢）結構相同：「睡眠方式 ← 被掠食風險」，末段的通則正是由此歸納而來。"},
 {lv:"次要資訊 Secondary Message（簡答）",type:"sa",
  q:"Q2. \"Some migratory birds have yet another impressive way of sleeping.\" What do \"yet another\" and \"For example\" tell you about how this paragraph fits into the whole article?",
  e:"【參考解答】<br>• yet another ＝「又一個／再一個」，明確標示這是同類清單中的第 N 項，暗示前面已出現長頸鹿、海獺、海豚三例，本段為第四例。它是把段落串成整體的「篇章照應詞（anaphoric linker）」，只看本段是讀不出它的作用的。<br>• For example 則把層級再往下一階：由「一群候鳥」縮小到「Alpine swifts 這個具體物種」，是「通則 → 實例」的下位化訊號。<br>詳解：因此本段有兩層結構：對外（yet another）連接全文清單，對內（For example）由類到種。學生若能辨識這兩個詞的不同層級，即掌握了非線性閱讀的核心能力。"},
 {lv:"訊息與細節 Details & Logic（四選一）",type:"mc",
  q:"Q3. \"This habit can save their lives since they may be caught by wild animals if they land.\" Which analysis is correct?",
  o:["This habit 回指前句「邊飛邊小睡」；since 表原因（非時間）；if 子句為條件，說明的是「不採取此習慣時」的後果。",
     "since 在此表「自從」，說明時間起點；if 子句為間接問句，確認這樣的睡覺方式是否安全。",
     "This habit 指的是吃昆蟲；since 表自從（時間連接詞）開始吃昆蟲時；if 子句說明「不採取此習慣」的後果。",
     "if they land 是主句，since 子句是修飾語。"],a:0,
  e:"答案：(A)<br>詳解：三個判讀重點——<br>① This habit 為照應詞，回指 take little naps while in flight（不是 eat insects，雖然該詞更靠近）。判斷依據是語意：救命的是「不落地」，不是「吃蟲」。近＝對，是位置迷思。<br>② since 有「因為／自從」雙義，此處後接推測性情態 may，語意為「因為」。若為「自從」，時態應為完成式。<br>③ if they land 是嵌在 since 子句裡的條件句，形成兩層從屬（since ⊃ if），推論鏈為：落地 → 可能被獵殺 → 所以不落地能保命。<br>生活活用：Since you're here, let's start.（既然）／I haven't seen him since 2020.（自從）"},
 {lv:"語言結構與生活活用 Language & Application（簡答）",type:"sa",
  q:"Q4. (a) \"may be able to stay in the air for up to two hundred days\" 中的 may、be able to、up to 三者各自扮演什麼角色？若全部刪除只寫 \"stay in the air for two hundred days\"，語氣有何改變？　(b) 請說明 \"in flight\" 與 \"flight\" 的其他生活語意。",
  e:"【參考解答】<br>(a) • may ＝ 推測情態，表「可能」，不作斷言。<br>　• be able to ＝ 表能力（此處與 may 連用，因 may can 不合語法，必須用 be able to 遞補）。<br>　• up to ＝「最多可達」，設定上限而非常態值。<br>　三者疊加後語氣為「據推測，最多可能達到 200 天」；若全部刪除，句子變成斬釘截鐵的事實宣稱，與前文 According to studies 的審慎語氣衝突，也不符科學寫作規範。<br>　★ 學測技巧：情態 + 上限詞 + 資料來源，三者常同時出現，是判斷「這是推測而非定論」的可靠訊號。<br>(b) • in flight ＝ 飛行中（同義 while flying）：The meal is served in flight.<br>　• flight ＝ 班機：My flight was delayed.<br>　• flight ＝ 逃亡：the flight of refugees<br>　• a flight of stairs ＝ 一段樓梯<br>　• flight of imagination ＝ 想像力的馳騁（語意延伸）"}
]},
{p:"Paragraph 6｜Conclusion",icon:"🌈",items:[
 {lv:"主要資訊 Main Message（四選一）",type:"mc",
  q:"Q1. What is the writer's final claim?",
  o:["Only four animals in the world mentioned in the reading have unusual sleeping habits.",
     "Scientists still cannot explain why animals sleep in totally different ways.",
     "It remains a mystery that animals sleep less than humans do.",
     "Different sleeping habits are different solutions to the same problem — staying alive — which makes each animal an expert at survival."],a:3,
  e:"答案：(D)<br>詳解：末段把四則案例從「奇聞」提升為「通則」：different creatures have different ways of avoiding danger。注意 avoiding danger 才是共同分母——長頸鹿的短睡、海獺的牽手、海豚的半腦、雨燕的滯空，形式各異但功能相同。<br>(A) 與 Yet these are just four examples 直接矛盾（just 正是為了預防這種誤讀而寫）；(B)(C) 文中無據。"},
 {lv:"次要資訊 Secondary Message（簡答）",type:"sa",
  q:"Q2. \"The sleeping habits ... may seem quite amazing. Yet these are just four examples.\" Why does the writer immediately qualify his own list with \"Yet\"? What would be lost without that sentence?",
  e:"【參考解答】Yet 在此為轉折，作用是「防止讀者把樣本誤當全體」。<br>詳解：作者先肯定四例的驚奇（may seem quite amazing），再用 Yet 把讀者的視野從「四個特例」推向「整個動物界的多樣性」（the wide variety... in the animal kingdom）。若刪去這句，文章就只是四則趣聞的並列，缺少歸納的正當性——下一句的通則將失去邏輯基礎。<br>★ 這是「歸納論證」的關鍵一步：必須先承認樣本有限，通則才顯得誠實可信。學生寫作結論時最常缺的正是這一句。"},
 {lv:"訊息與細節 Details & Logic（四選一）",type:"mc",
  q:"Q3. \"The wide variety of sleeping habits in the animal kingdom shows how different creatures have different ways of avoiding danger.\" Which statement about this sentence is correct?",
  o:["how 引導的是名詞子句，當 shows 的受詞，語序為 S+V（間接問句），且整句把「多樣性」重新定義為「求生策略的多樣性」。",
     "how 引導的是直接問句，故須加問號。",
     "shows 的主詞是 sleeping habits。",
     "different 重複兩次是作者的用字疏失，應刪去其一。"],a:0,

var WB={};
function makeWB(key,host,items,opts){
  opts=opts||{};

  renderWB(key);
}
function renderWB(key){
  var s=WB[key];
  if(s.ptr>=s.pool.length){s.pool=shuffle(s.pool);s.ptr=0;}
  s.cur=s.pool.slice(s.ptr,s.ptr+s.size);
  s.fill={};s.sel=null;s.done=false;
  var chips=shuffle(s.cur.map(function(x){return x.en;}));
  var h='<button class="btn pink wb-toggle" onclick="tgWB(\''+key+'\')">🧲 Word Bank（點我展開／收合選項）</button>'+
        '<div class="wb-panel" id="wbp-'+key+'"><div class="wb-chips" id="wbc-'+key+'">';

    h+='<div class="qrow"><span class="qnum">'+(i+1)+'</span><span class="qzh">'+esc(it.zh)+'</span>'+
       (s.audio?'<button class="spk" onclick="sayWB(\''+key+'\','+i+')">🔊</button>':'')+
       '<button class="blank" id="bk-'+key+'-'+i+'" onclick="place(\''+key+'\','+i+')">點此填入</button></div>';
  });

     '<button class="btn gray" onclick="nextWB(\''+key+'\')">🔄 下一輪（重新洗牌）</button>'+
     '<span class="wcount" id="wbs-'+key+'"></span></div><div class="exp" id="wbe-'+key+'"></div>';
  document.getElementById(s.host).innerHTML=h;
}
function sayWB(key,i){say(WB[key].cur[i].en);}
function tgWB(key){document.getElementById("wbp-"+key).classList.toggle("open");}
function pick(key,btn){
  var s=WB[key];
  document.querySelectorAll("#wbc-"+key+" .chip").forEach(function(c){c.classList.remove("sel");});
  btn.classList.add("sel");s.sel=btn;
}
function esc4sel(v){
  if(window.CSS&&CSS.escape)return CSS.escape(v);
  return String(v).replace(/[^a-zA-Z0-9_-]/g,function(c){return "\\"+c;});
}
function place(key,i){
  var s=WB[key],b=document.getElementById("bk-"+key+"-"+i);
  if(s.fill[i]!=null){
    var en=s.fill[i];delete s.fill[i];
    b.className="blank";b.textContent="點此填入";
    var c=document.querySelector('#wbc-'+key+' .chip[data-en="'+esc4sel(en)+'"].used');
    if(c)c.classList.remove("used");
    return;
  }
  if(!s.sel){toast("請先在 🧲 Word Bank 中點選一個答案 👆");return;}
  var en2=s.sel.getAttribute("data-en");
  s.fill[i]=en2;b.className="blank filled";b.textContent=en2;
  s.sel.classList.add("used");s.sel.classList.remove("sel");s.sel=null;
}
function maskAns(en){
  var w=String(en).trim().split(/\s+/);
  if(w.length<2)return w[0].charAt(0)+new Array(Math.max(w[0].length,3)).join("_");
  var rest=w.slice(1).join(" ");
  return w[0]+" "+new Array(Math.min(rest.length,14)+1).join("_");
}
function checkWB(key){
  var s=WB[key],right=0,wrong=0;
  s.cur.forEach(function(it,i){

  });
  if(!s.done){addScore(right*200-wrong*50);s.done=true;}
  document.getElementById("wbs-"+key).textContent=" ✅ 本輪答對："+right+"/"+s.cur.length;

  e.innerHTML=h;e.classList.add("open");
  if(wrong===0)fireworks();
}

function previewShot(input){
  var box=document.getElementById("shotBox");
  if(!input.files||!input.files.length){box.innerHTML="";return;}
  var f=input.files[0];
  if(!/^image\//.test(f.type||"")){toast("請選擇圖片檔（JPG／PNG）🙏");return;}
  var r=new FileReader();
  r.onload=function(e){
    box.innerHTML='<img src="'+e.target.result+'" alt="課文圈畫照片預覽" style="max-width:100%;border-radius:12px;border:2px solid var(--line)">'+
      '<div class="wcount">✅ 已選擇：'+esc(f.name)+'（'+Math.round(f.size/1024)+' KB）　'+
      '若畫面清楚，請依下方步驟上傳到 Google Classroom。此預覽只在你的裝置上，<b>不會自動送出</b>。</div>';
  };
  r.onerror=function(){toast("照片讀取失敗，請再試一次 🙏");};
  r.readAsDataURL(f);
}
function clearShot(){
  var b=document.getElementById("shotBox");if(b)b.innerHTML="";
  var i=document.getElementById("shotFile");if(i)i.value="";
}
function showAn(pi,si,el){
  document.querySelectorAll(".sent").forEach(function(s){s.classList.remove("on");});
  el.classList.add("on");
  var st=TEXT[pi].s[si];
  document.getElementById("anBody").innerHTML=
   '<div style="font-size:15px"><b>🎓 句型解析大師</b><br><br>'+
   '<b>英文：</b>'+esc(st[0])+' <button class="spk" onclick="say(TEXT['+pi+'].s['+si+'][0],0.9)">🔊</button><br><br>'+
   '<b>解析：</b>'+st[1]+'</div>';
  document.getElementById("analysis").classList.add("open");
}
function closeAn(){var a=document.getElementById("analysis");if(a)a.classList.remove("open");
  document.querySelectorAll(".sent").forEach(function(s){s.classList.remove("on");});}

     '<div class="exp" id="abfb"></div></div>'+
   '<div class="card"><h3 class="sub">📐 Tips on making a summary（Non-linear Thinking）</h3>'+

   '<tr><td>32 words</td><td>四種動物＋各自睡法＋避險目的</td><td>brown bears、goldfish、細部數據</td><td>把六段壓成「案例＋通則」</td></tr>'+

   '<tr><td>Hashtag</td><td>One idea：不同睡法＝同一個求生目的</td><td>所有動物、地點與數據</td><td>只留最高層級的主張，濃縮成一個標籤</td></tr></table>'+

/* GSAT */
function buildD4(){
  var h='<div class="card"><h3 class="sub">第 1–2 題：課文摘要填空（Summary Cloze）</h3>'+
  '<p>說明：請從課文中找出最適合的單詞填入摘要空格，並視語法需要做適當字形變化，每格限填一個單詞。</p>'+
  '<p style="line-height:2.4">Animals have amazing sleeping habits: giraffes nap briefly, otters hold paws while (1) <input class="tin" id="gc-a" style="width:150px;display:inline-block">, dolphins stay half awake, swifts sleep in flight, each (2) <input class="tin" id="gc-b" style="width:150px;display:inline-block"> predators.</p>'+
  '<button class="btn" onclick="checkCloze()">✅ Check answers</button>'+
  reveal('<b>【📖 參考解答:】(1) floating</b><br>詳解：課文原字為動詞原形 float（Groups of sea otters float on their backs and hold hands...）。空格前為連接詞 while，在此為「while + V-ing」的分詞構句省略結構（完整形式為 while they are floating），主詞與主要子句主詞 otters 一致，故 be 動詞與主詞可省略，只留 V-ing。因此須將 float 變化為 floating。<br>語意檢核：課文中海獺是「仰躺漂浮」與「牽手」同時發生的兩個動作，摘要用 while 把兩者合併為一個畫面，語意與原文一致。<br>常見錯誤：填 float（未做字形變化，違反 while 後接 V-ing 的結構）或 floated（被動／過去分詞語意不合，海獺是主動漂浮）。<br><br>'+
   '<b>【📖 參考解答:】(2) avoiding</b><br>詳解：課文原字為動詞原形 avoid（...how different creatures have different ways of avoiding danger.／To avoid floating away...）。空格前為代名詞 each（指前述四種動物），此處為獨立分詞構句 (each avoiding predators)，補充說明「每種動物各自以其方式躲避掠食者」。分詞構句的主詞 each 與主要子句主詞不同，故保留主詞並使用 V-ing，須將 avoid 變化為 avoiding。<br>語意檢核：末段主旨句 different creatures have different ways of avoiding danger 正是全文收束的核心概念，摘要以 each avoiding predators 濃縮此主要訊息（Main Message）。<br>常見錯誤：填 avoid（each 之後無主要動詞可支撐，會造成句構破碎）或 avoided（過去式與全文現在式的通則陳述不符）。')+
  '<div class="exp" id="gcfb"></div></div>'+
  '<div class="card"><h3 class="sub">【學測混合題 — 多選題】</h3><b>'+esc(GSAT_MULTI.q)+'</b><div id="gmOpts">';
  GSAT_MULTI.o.forEach(function(o,i){h+='<button class="opt" onclick="this.classList.toggle(\'sel\')" data-i="'+i+'">'+esc(o)+'</button>';});
  h+='</div><button class="btn" onclick="checkMulti()">✅ Check answers</button>'+reveal(GSAT_MULTI.e)+'<div class="exp" id="gmfb"></div></div>'+
  '<div class="card"><h3 class="sub">第 4 題（簡答）</h3>'+
  '<p>Which phrase in the reading means “to watch carefully in order to notice possible danger”?</p>'+
  '<input class="tin" id="gs-1" placeholder="請填入課文中的片語"><br>'+
  '<button class="btn" onclick="checkShort()">✅ Check answers</button>'+
  reveal('<b>【📖 參考解答:】</b> be on the lookout for（課文原句：the other half stays awake to help them swim, breathe, and be on the lookout for danger）<br>詳解：本題考「片語語意的等值轉換」。題幹 watch carefully in order to notice possible danger 拆解為兩個語意成分：①持續、警覺地注意 ②目的在於察覺潛在危險。be on the lookout for 正好兼具兩者。<br>易誤選 look out for（同段稍前 They also have to look out for sharks）。此答案語意相近，但 be on the lookout for 是名詞化片語（lookout 為名詞，意為「警戒、瞭望」），強調「處於警戒狀態」的持續性，與題幹 watch carefully 的狀態義更貼合；若學生作答 look out for 可酌予部分分數，並藉此比較兩者的細微差異。<br>延伸語言點：look 在本課展現多義性（polysemy）——look out for（提防）、be on the lookout for（警戒）、look like（看起來像）。lookout 由動詞片語轉為名詞，是英語中常見的構詞現象（如 breakout、takeoff、setback）。')+
  '<div class="exp" id="gsfb"></div></div>';
  document.getElementById("d4").innerHTML=h;
}
function checkCloze(){
  var a=document.getElementById("gc-a").value.trim().toLowerCase();
  var b=document.getElementById("gc-b").value.trim().toLowerCase();
  var r=0,w=0;
  if(a==="floating")r++;else w++;
  if(b==="avoiding")r++;else w++;
  addScore(r*200-w*50);
  var e=document.getElementById("gcfb");
  e.innerHTML="✅ 答對 "+r+" / 2 格。"+(w?"　尚有空格需要再想一想，可點開【📖 參考解答：】確認。":"　太棒了，完全正確！");
  e.classList.add("open");
  if(!w)fireworks();
}
function checkMulti(){
  var box=document.getElementById("gmOpts"),picked=[];
  box.querySelectorAll(".opt").forEach(function(b,i){if(b.classList.contains("sel"))picked.push(i);});
  var right=picked.filter(function(i){return GSAT_MULTI.a.indexOf(i)>=0;}).length;
  var wrong=picked.length-right;
  box.querySelectorAll(".opt").forEach(function(b,i){
    b.classList.add("dis");b.classList.remove("sel");
    if(GSAT_MULTI.a.indexOf(i)>=0)b.classList.add("right");
    else if(picked.indexOf(i)>=0)b.classList.add("wrong");
  });
  addScore(right*200-wrong*50);
  var e=document.getElementById("gmfb");
  e.innerHTML="✅ 選對 "+right+" / 3 個；誤選 "+wrong+" 個。<br>📌 給分規則：每選對一項 +200，每誤選一項 −50（總分最低為 0）。";
  e.classList.add("open");
  if(right===3&&wrong===0)fireworks();
}
function checkShort(){
  var v=document.getElementById("gs-1").value.toLowerCase().replace(/[^a-z' ]/g,"").replace(/\s+/g," ").trim();
  var full=/be on the lookout for|on the lookout for/.test(v);
  var part=/look out for/.test(v);

/* ===================== AI 批改（含離線備援） ===================== */
function localFix(s){
  var t=String(s).trim();
  t=t.replace(/\bi\b/g,"I").replace(/\bdont\b/gi,"don't").replace(/\bcant\b/gi,"can't")
     .replace(/\bdoesnt\b/gi,"doesn't").replace(/\bisnt\b/gi,"isn't").replace(/\bwont\b/gi,"won't")
     .replace(/\bim\b/gi,"I'm").replace(/\s+/g," ");
  if(t)t=t.charAt(0).toUpperCase()+t.slice(1);
  if(t&&!/[.!?]$/.test(t))t+=".";
  return t;
}
function localFeedback(s){
  var n=String(s).trim().split(/\s+/).filter(Boolean).length;
  if(n===0)return "還沒有看到你的答案唷！先寫下一兩句你的想法，老師才有辦法陪你一起把它磨亮 ✨";
  var tip=n<8?"你的想法已經開始成形了！再多加一個具體的<b>課文證據</b>（引用一個關鍵字或一句原文），你的論述會立刻更有說服力 💪":
          "很棒，你寫得相當完整！接下來試著問自己：<b>我的每一句都能在課文裡找到依據嗎？</b>把最強的那個證據放到句子最前面，讀者一眼就懂 🌟";
  return "<b>🤖 AI 老師的引導</b><br><b>語句修飾建議：</b>"+esc(localFix(s))+"<br><br>"+tip+
   "<br><br>📌 老師不直接給答案唷——請先照著上面的方向再修一次，再點開【📖 參考解答：】驗證你的推論。";
}
function callAI(prompt){
  return new Promise(function(res,rej){
    try{
      if(typeof fetch!=="function"){rej(new Error("no fetch"));return;}
      fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:prompt}]})
      }).then(function(r){return r.json();}).then(res,rej);
    }catch(e){rej(e);}
  });
}
function aiGuide(taId,fbId){
  var v=document.getElementById(taId).value;
  var fb=document.getElementById(fbId);
  fb.innerHTML="⏳ AI 老師閱讀中……";fb.classList.add("open");
  var prompt="你是一位親切、活潑、鼓勵學生的高中英文老師。學生的答案如下：\n\n"+v+
   "\n\n請用繁體中文回覆：(1) 先給一句真誠的肯定；(2) 指出拼字、文法、時態需要修正之處並示範改寫（Revise the sentence to make it grammatically correct and efficient in the meaning）；(3) 用問句引導學生自己想出更完整的推論。切記：絕對不可以直接告訴學生正確答案。";
  callAI(prompt).then(function(d){
    var txt=(d.content||[]).map(function(x){return x.type==="text"?x.text:"";}).filter(Boolean).join("\n");
    if(!txt)throw new Error("empty");
    fb.innerHTML="<b>🤖 AI 老師的引導</b><br>"+esc(txt).replace(/\n/g,"<br>");
  }).catch(function(){fb.innerHTML=localFeedback(v);});
}

   "\n\n請用繁體中文回覆：先肯定學生，接著針對每一階段 Revise the sentence to make it grammatically correct and efficient in the meaning，並用問句引導學生思考「本課的重點是 avoiding danger / surviving，而不只是睡姿奇特」。不可直接給出標準答案。";

    fb.innerHTML=h;

}
